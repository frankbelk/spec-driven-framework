apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sdd-coder-agent-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sdd-coder-agent
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: External
    external:
      metric:
        name: sdd_queue_depth
      target:
        type: AverageValue
        averageValue: "5"